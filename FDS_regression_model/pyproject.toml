[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semiconductor-anomaly-model"
version = "0.2.1"
description = "Fixed rolling OLS semiconductor stock anomaly model with CSV and LLM JSON outputs"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2.2,<3", "tzdata>=2024.1"]

[project.optional-dependencies]
data = ["requests>=2.31,<3", "finance-datareader==0.9.202", "pandas_market_calendars==5.5.0"]

[tool.setuptools.packages.find]
include = ["semiconductor_model*"]
